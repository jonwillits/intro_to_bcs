<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 352" width="610" height="352" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="305.0" y="22.0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="bold">Built from the inside out</text>
<rect x="150.0" y="66.0" width="310.0" height="208.0" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1.2" rx="4"/>
<text x="140.0" y="80.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">outer surface</text>
<text x="140.0" y="268.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">inner surface</text>
<text x="140.0" y="288.0" font-size="10" fill="#5b6470" text-anchor="end" font-weight="normal">(lining the tube)</text>
<line x1="150.0" y1="66.0" x2="460.0" y2="66.0" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/>
<line x1="150.0" y1="274.0" x2="460.0" y2="274.0" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/>
<line x1="250.0" y1="274.0" x2="250.0" y2="66.0" stroke="#6B7280" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="250.0" cy="284.0" r="8.0" fill="#eef0f2" stroke="#6B7280" stroke-width="1.6"/>
<line x1="206.0" y1="300.0" x2="240.0" y2="286.0" stroke="#e2e6ec" stroke-width="1.0" stroke-linecap="round"/>
<text x="200.0" y="304.0" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">radial glial cell</text>
<text x="268.0" y="92.0" font-size="10" fill="#5b6470" text-anchor="start" font-weight="normal">its fiber spans the wall</text>
<circle cx="300.0" cy="242.0" r="9.0" fill="#c9ced6" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="334.0" cy="242.0" r="9.0" fill="#c9ced6" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="368.0" cy="242.0" r="9.0" fill="#c9ced6" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="402.0" cy="242.0" r="9.0" fill="#c9ced6" stroke="#6B7280" stroke-width="1.4"/>
<text x="236.0" y="246.0" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">first wave</text>
<line x1="250.0" y1="268.0" x2="250.0" y2="261.0" stroke="#6B7280" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 3"/>
<polygon points="250.0,254.0 253.2,261.0 246.8,261.0" fill="#6B7280"/>
<circle cx="300.0" cy="182.0" r="9.0" fill="#9aa3ae" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="334.0" cy="182.0" r="9.0" fill="#9aa3ae" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="368.0" cy="182.0" r="9.0" fill="#9aa3ae" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="402.0" cy="182.0" r="9.0" fill="#9aa3ae" stroke="#6B7280" stroke-width="1.4"/>
<text x="236.0" y="186.0" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">second</text>
<line x1="250.0" y1="264.0" x2="250.0" y2="201.0" stroke="#6B7280" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 3"/>
<polygon points="250.0,194.0 253.2,201.0 246.8,201.0" fill="#6B7280"/>
<circle cx="300.0" cy="122.0" r="9.0" fill="#6B7280" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="334.0" cy="122.0" r="9.0" fill="#6B7280" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="368.0" cy="122.0" r="9.0" fill="#6B7280" stroke="#6B7280" stroke-width="1.4"/>
<circle cx="402.0" cy="122.0" r="9.0" fill="#6B7280" stroke="#6B7280" stroke-width="1.4"/>
<text x="236.0" y="126.0" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">third</text>
<line x1="250.0" y1="260.0" x2="250.0" y2="141.0" stroke="#6B7280" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 3"/>
<polygon points="250.0,134.0 253.2,141.0 246.8,141.0" fill="#6B7280"/>
<text x="305.0" y="324.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">each wave climbs past the waves already in place</text>
<text x="305.0" y="340.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="italic">so the deepest layer is the oldest and the outermost the youngest</text>
</svg>

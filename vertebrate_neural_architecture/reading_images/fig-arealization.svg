<text x="370.0" y="286.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">where a cell sits in the pair of gradients sets which area it belongs to</text>
<text x="370.0" y="328.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="italic">shift one gradient and every boundary moves together</text>

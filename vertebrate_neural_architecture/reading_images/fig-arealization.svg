<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<defs><linearGradient id="gx" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#13294B" stop-opacity="0.42"/><stop offset="100%" stop-color="#13294B" stop-opacity="0.03"/></linearGradient><linearGradient id="gy" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#FF5F05" stop-opacity="0.38"/><stop offset="100%" stop-color="#FF5F05" stop-opacity="0.03"/></linearGradient><linearGradient id="gy2" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#FF5F05" stop-opacity="0.17"/><stop offset="100%" stop-color="#FF5F05" stop-opacity="0.02"/></linearGradient></defs>
<text x="370.0" y="22.0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="bold">Two gradients, and the areas that fall out of them</text>
<text x="190.0" y="72.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="bold">as it is</text>

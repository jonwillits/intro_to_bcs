<text x="85.0" y="170.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">motor</text>
<text x="172.0" y="170.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">somatosensory</text>
<text x="277.0" y="170.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">visual</text>

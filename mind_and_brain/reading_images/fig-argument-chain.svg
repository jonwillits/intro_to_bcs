<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" width="800" height="498" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/></marker></defs>
<rect x="0" y="0" width="800" height="58" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="400.0" y="23.6" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Mind is a real property of the physical — not a separate stuff, and not a</text>
<text x="400.0" y="45.2" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">redundant name for the brain</text>
<line x1="400.0" y1="62" x2="400.0" y2="84" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#a2)"/>
<rect x="0" y="88" width="800" height="58" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="400.0" y="122.4" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">So it cannot be fully understood at any one level</text>
<line x1="400.0" y1="150" x2="400.0" y2="172" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#a2)"/>
<rect x="0" y="176" width="800" height="58" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="400.0" y="210.4" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">So a science of mind needs a framework of levels</text>
<line x1="400.0" y1="238" x2="400.0" y2="260" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#a2)"/>
<rect x="0" y="264" width="800" height="58" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="400.0" y="298.4" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Marr’s three: computational, algorithmic, implementational</text>
<line x1="400.0" y1="326" x2="400.0" y2="348" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#a2)"/>
<rect x="0" y="352" width="800" height="58" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="400.0" y="375.59999999999997" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">Which line up with the disciplines, and with the evolutionary spine beneath</text>
<text x="400.0" y="397.2" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">them</text>
<line x1="400.0" y1="414" x2="400.0" y2="436" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#a2)"/>
<rect x="0" y="440" width="800" height="58" rx="7" fill="#eef3fa" stroke="#13294B" stroke-width="1.2"/>
<text x="400.0" y="474.4" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="middle">So the course is built around them</text>
</svg>
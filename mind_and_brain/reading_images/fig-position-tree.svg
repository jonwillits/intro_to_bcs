<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<rect x="0" y="6" width="396" height="86" rx="7" fill="#eaf0f8" stroke="#13294B" stroke-width="1.2"/>
<text x="198.0" y="43.78" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">Q1. Do the physical facts fix the mental</text>
<text x="198.0" y="64.66" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">facts?</text>
<line x1="396" y1="49.0" x2="504" y2="49.0" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="450" y="41.0" font-size="13" fill="#5b6470" text-anchor="middle" font-style="italic">No</text>
<rect x="504" y="6" width="350" height="86" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="520" y="40" font-size="14.5" fill="#1a1a1a" font-weight="bold">Mind is a distinct kind of thing</text>
<text x="520" y="64" font-size="13" fill="#5b6470">substance dualism · idealism · panpsychism ·</text>
<text x="520" y="83" font-size="13" fill="#5b6470">neutral monism</text>
<line x1="198.0" y1="92" x2="198.0" y2="118" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="212.0" y="110" font-size="13" fill="#5b6470" font-style="italic">Yes</text>
<rect x="0" y="118" width="396" height="86" rx="7" fill="#eaf0f8" stroke="#13294B" stroke-width="1.2"/>
<text x="198.0" y="155.78" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">Q2. Do our mental terms name anything</text>
<text x="198.0" y="176.66" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">real?</text>
<line x1="396" y1="161.0" x2="504" y2="161.0" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="450" y="153.0" font-size="13" fill="#5b6470" text-anchor="middle" font-style="italic">No</text>
<rect x="504" y="118" width="350" height="86" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="520" y="152" font-size="14.5" fill="#1a1a1a" font-weight="bold">Mind is nothing but the physical</text>
<text x="520" y="176" font-size="13" fill="#5b6470">eliminative materialism · radical behaviorism</text>
<line x1="198.0" y1="204" x2="198.0" y2="230" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="212.0" y="222" font-size="13" fill="#5b6470" font-style="italic">Yes</text>
<rect x="0" y="230" width="396" height="86" rx="7" fill="#eaf0f8" stroke="#13294B" stroke-width="1.2"/>
<text x="198.0" y="267.78000000000003" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">Q3. Is a mental state identical to one</text>
<text x="198.0" y="288.66" font-size="14.5" font-weight="normal" fill="#13294B" text-anchor="middle">specific physical state?</text>
<line x1="396" y1="273.0" x2="504" y2="273.0" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="450" y="265.0" font-size="13" fill="#5b6470" text-anchor="middle" font-style="italic">Yes</text>
<rect x="504" y="230" width="350" height="86" rx="7" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<text x="520" y="264" font-size="14.5" fill="#1a1a1a" font-weight="bold">Each mental state is one brain state</text>
<text x="520" y="288" font-size="13" fill="#5b6470">identity theory</text>
<line x1="198.0" y1="316" x2="198.0" y2="342" stroke="#9aa4b2" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="212.0" y="334" font-size="13" fill="#5b6470" font-style="italic">No</text>
<rect x="0" y="342" width="854" height="74" rx="7" fill="#eef3fa" stroke="#13294B" stroke-width="1.2"/>
<text x="430.0" y="374" font-size="16" font-weight="bold" fill="#13294B" text-anchor="middle">Mind is a real property of the physical</text>
<text x="430.0" y="398" font-size="13.5" fill="#5b6470" text-anchor="middle">emergentism · functionalism · levels of analysis — where most of the field sits</text>
<text x="0" y="448" font-size="14.5" fill="#13294B" font-weight="bold">Q4.  How freely can such a mind be studied in its own terms?</text>
<text x="0" y="468" font-size="13" fill="#5b6470" font-style="italic">a matter of degree, not another fork — and the field is genuinely split along it</text>
<rect x="0" y="486" width="854" height="16" rx="8" fill="#dfe6f0"/>
<text x="0" y="526" font-size="13.5" fill="#1a1a1a">Strong autonomy: psychology as chemistry is to physics</text>
<text x="854" y="526" font-size="13.5" fill="#1a1a1a" text-anchor="end">Realization-sensitive: embodiment, the speed of neurons</text>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/></marker></defs>
</svg>
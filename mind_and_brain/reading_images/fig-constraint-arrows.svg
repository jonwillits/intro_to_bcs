<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#13294B"/></marker></defs>
<rect x="0" y="0" width="800" height="74" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="0" y="0" width="6" height="74" fill="#13294B"/>
<text x="24" y="43.0" font-size="17" font-weight="bold" fill="#13294B">Computational</text>
<rect x="0" y="150" width="800" height="74" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="0" y="150" width="6" height="74" fill="#FF5F05"/>
<text x="24" y="193.0" font-size="17" font-weight="bold" fill="#b8460a">Algorithmic</text>
<rect x="0" y="300" width="800" height="74" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="0" y="300" width="6" height="74" fill="#6B7280"/>
<text x="24" y="343.0" font-size="17" font-weight="bold" fill="#6B7280">Implementational</text>
<line x1="150" y1="82" x2="150" y2="142" stroke="#13294B" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="168" y="104" font-size="13" fill="#1a1a1a">the problem’s structure narrows</text>
<text x="168" y="122" font-size="13" fill="#1a1a1a">which algorithms are plausible</text>
<line x1="470" y1="142" x2="470" y2="82" stroke="#13294B" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="488" y="104" font-size="13" fill="#1a1a1a">the representations available</text>
<text x="488" y="122" font-size="13" fill="#1a1a1a">bound which problems can be solved</text>
<line x1="150" y1="232" x2="150" y2="292" stroke="#13294B" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="168" y="254" font-size="13" fill="#1a1a1a">an algorithm that stores associations</text>
<text x="168" y="272" font-size="13" fill="#1a1a1a">demands connections that can change</text>
<line x1="470" y1="292" x2="470" y2="232" stroke="#13294B" stroke-width="1.6" marker-end="url(#a1)"/>
<text x="488" y="254" font-size="13" fill="#1a1a1a">slow neurons force algorithms that</text>
<text x="488" y="272" font-size="13" fill="#1a1a1a">compute many things in parallel</text>
<rect x="0" y="396" width="800" height="56" rx="8" fill="#f7f2ea" stroke="#e2d6c4" stroke-width="1"/>
<path d="M 40 440 L 40 409" fill="none" stroke="#b8460a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b8460a"/></marker></defs>
<text x="72" y="420" font-size="13.5" fill="#1a1a1a">And discovery often runs upward: which problem a system solves is itself something we work out</text>
<text x="72" y="439" font-size="13.5" fill="#1a1a1a">by studying how it works. That is a point about the science, not about the systems.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<rect x="0.0" y="0" width="260.0" height="260" rx="8" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="0.0" y="0" width="260.0" height="38" rx="8" fill="#e7ecf4"/>
<rect x="0.0" y="30" width="260.0" height="8" fill="#e7ecf4"/>
<text x="130.0" y="25" font-size="16" font-weight="bold" fill="#13294B" text-anchor="middle">Eliminated</text>
<text x="130.0" y="84.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">The four humors named nothing, and</text>
<text x="130.0" y="106.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">were dropped rather than refined.</text>
<line x1="18.0" y1="142" x2="242.0" y2="142" stroke="#e2e6ec" stroke-width="1"/>
<text x="130.0" y="195.0" font-size="14" fill="#5b6470" text-anchor="middle">Eliminative materialism’s bet</text>
<text x="130.0" y="216.0" font-size="14" fill="#5b6470" text-anchor="middle">about beliefs and desires.</text>
<rect x="270.0" y="0" width="260.0" height="260" rx="8" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="270.0" y="0" width="260.0" height="38" rx="8" fill="#e7ecf4"/>
<rect x="270.0" y="30" width="260.0" height="8" fill="#e7ecf4"/>
<text x="400.0" y="25" font-size="16" font-weight="bold" fill="#13294B" text-anchor="middle">Identified</text>
<text x="400.0" y="73.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">Heat turned out to be molecular</text>
<text x="400.0" y="95.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">motion itself. One thing, two</text>
<text x="400.0" y="117.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">names.</text>
<line x1="288.0" y1="142" x2="512.0" y2="142" stroke="#e2e6ec" stroke-width="1"/>
<text x="400.0" y="184.0" font-size="14" fill="#5b6470" text-anchor="middle">Identity theory’s bet: each mental</text>
<text x="400.0" y="205.0" font-size="14" fill="#5b6470" text-anchor="middle">state is one particular brain</text>
<text x="400.0" y="226.0" font-size="14" fill="#5b6470" text-anchor="middle">state.</text>
<rect x="540.0" y="0" width="260.0" height="260" rx="8" fill="#f4f7fb" stroke="#e2e6ec" stroke-width="1"/>
<rect x="540.0" y="0" width="260.0" height="38" rx="8" fill="#e7ecf4"/>
<rect x="540.0" y="30" width="260.0" height="8" fill="#e7ecf4"/>
<text x="670.0" y="25" font-size="16" font-weight="bold" fill="#13294B" text-anchor="middle">Grounded, and kept</text>
<text x="670.0" y="62.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">Temperature is explained by</text>
<text x="670.0" y="84.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">statistical mechanics, and</text>
<text x="670.0" y="106.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">thermodynamics still does real</text>
<text x="670.0" y="128.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle">work.</text>
<line x1="558.0" y1="142" x2="782.0" y2="142" stroke="#e2e6ec" stroke-width="1"/>
<text x="670.0" y="173.0" font-size="14" fill="#5b6470" text-anchor="middle">Where most of the field sits:</text>
<text x="670.0" y="194.0" font-size="14" fill="#5b6470" text-anchor="middle">mental terms name something real,</text>
<text x="670.0" y="215.0" font-size="14" fill="#5b6470" text-anchor="middle">explained by the brain without</text>
<text x="670.0" y="236.0" font-size="14" fill="#5b6470" text-anchor="middle">being replaced by it.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<rect x="30" y="120" width="118" height="160" rx="8" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2"/>
<rect x="76" y="152" width="26" height="96" fill="#9aa4b2"/>
<text x="89" y="304" font-size="13.5" fill="#5b6470" text-anchor="middle">what the eye</text>
<text x="89" y="321" font-size="13.5" fill="#5b6470" text-anchor="middle">receives</text>
<line x1="205" y1="200" x2="740" y2="39.5" stroke="#c2c9d4" stroke-width="1.3" stroke-dasharray="6 5"/>
<line x1="205" y1="200" x2="740" y2="360.5" stroke="#c2c9d4" stroke-width="1.3" stroke-dasharray="6 5"/>
<circle cx="205" cy="200" r="7" fill="#13294B"/>
<text x="205" y="228" font-size="13.5" fill="#5b6470" text-anchor="middle">eye</text>
<line x1="330" y1="162.5" x2="330" y2="237.5" stroke="#13294B" stroke-width="7" stroke-linecap="round"/>
<text x="330.0" y="267.5" font-size="13.5" fill="#1a1a1a" text-anchor="middle">a small surface, close</text>
<line x1="470" y1="120.5" x2="560" y2="306.5" stroke="#13294B" stroke-width="7" stroke-linecap="round"/>
<text x="515.0" y="336.5" font-size="13.5" fill="#1a1a1a" text-anchor="middle">a surface slanted away</text>
<line x1="700" y1="51.5" x2="700" y2="348.5" stroke="#13294B" stroke-width="7" stroke-linecap="round"/>
<text x="700.0" y="378.5" font-size="13.5" fill="#1a1a1a" text-anchor="middle">a large surface, far off</text>
<text x="14" y="30" font-size="14" fill="#5b6470" font-style="italic">every one of them casts exactly the same image —</text>
<text x="14" y="50" font-size="14" fill="#5b6470" font-style="italic">and so do infinitely many others</text>
</svg>
<text x="28.0" y="142.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="italic">The car was parked on the road.</text>
<text x="28.0" y="160.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="italic">The dog chased the cat.</text>

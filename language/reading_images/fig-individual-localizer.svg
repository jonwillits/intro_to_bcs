<text x="636" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">group map</text>
<text x="360" y="176" font-size="13" fill="#1a1a1a" text-anchor="middle">Each person’s regions lie in slightly different places.</text>
<text x="360" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">The best-overlapping location was active in only 18 of 25 people, and the group map</text>
<text x="360" y="211" font-size="12" fill="#1a1a1a" text-anchor="middle">captured about a third of each person’s activity.</text>
<text x="360" y="240" font-size="12" fill="#5b6470" text-anchor="middle" font-style="italic">schematic, after Fedorenko et al. (2010), Fig. 5, and (2024), Fig. 2; left hemisphere, front at left</text>
</svg>

<text x="100.0" y="124.0" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 100.0 124.0)">percentage correct</text>
<line x1="150.0" y1="177.3" x2="510.0" y2="177.3" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<rect x="200.0" y="81.1" width="90.0" height="122.9" fill="#FF5F05" stroke="none" stroke-width="1.2" rx="0"/>
<text x="245.0" y="101.1" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">86.1%</text>
<text x="245.0" y="221.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">grammar</text>
<text x="245.0" y="235.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">(pairs of sentences)</text>
<rect x="370.0" y="154.9" width="90.0" height="49.1" fill="#FF5F05" stroke="none" stroke-width="1.2" rx="0"/>
<text x="415.0" y="147.9" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">58.4%</text>
<text x="415.0" y="221.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">knowledge about the world</text>
<text x="516.0" y="181.3" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">chance</text>
<line x1="190.0" y1="74.4" x2="300.0" y2="74.4" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>

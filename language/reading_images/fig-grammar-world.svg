<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="360.0" y="22.0" font-size="14" fill="#b8460a" text-anchor="middle" font-weight="bold">Best scores of models trained on 100 million words, 2024</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="360" y="22" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="bold">A split-brain test: one word to each hemisphere</text>
<rect x="170" y="46" width="380" height="56" fill="#eef0f2" stroke="#1a1a1a" stroke-width="1.4" rx="4"/>
<text x="270" y="82" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">KEY</text>
<text x="450" y="82" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">RING</text>
<circle cx="360" cy="76" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<text x="360" y="118" font-size="12" fill="#5b6470" text-anchor="middle">the person looks at the dot; each word is flashed for under 200 ms</text>
<ellipse cx="360" cy="222" rx="70" ry="78" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6" transform="rotate(0 360 222)"/>
<ellipse cx="327" cy="226" rx="30" ry="62" fill="#eef0f2" stroke="#1a1a1a" stroke-width="1.2" transform="rotate(0 327 226)"/>
<ellipse cx="393" cy="226" rx="30" ry="62" fill="#eef0f2" stroke="#1a1a1a" stroke-width="1.2" transform="rotate(0 393 226)"/>
<line x1="360" y1="172" x2="360" y2="282" stroke="#6B7280" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="360" y="314" font-size="12" fill="#6B7280" text-anchor="middle">corpus callosum cut</text>
<text x="327" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">left</text>
<text x="393" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">right</text>
<line x1="270" y1="104" x2="393" y2="202" stroke="#5b6470" stroke-width="1.4" stroke-linecap="round"/>
<line x1="450" y1="104" x2="327" y2="202" stroke="#5b6470" stroke-width="1.4" stroke-linecap="round"/>
<rect x="96" y="176" width="168" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" rx="14"/>
<text x="180" y="196" font-size="13" fill="#1a1a1a" text-anchor="middle">the person says “ring”,</text>
<text x="180" y="214" font-size="13" fill="#1a1a1a" text-anchor="middle">and saw nothing else</text>
<line x1="264" y1="202" x2="310" y2="212" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
<text x="180" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">speech comes from the left hemisphere</text>
<rect x="470" y="196" width="190" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" rx="6"/>
<text x="565" y="216" font-size="12" fill="#1a1a1a" text-anchor="middle">the right hemisphere guides</text>
<text x="565" y="232" font-size="12" fill="#1a1a1a" text-anchor="middle">the left hand to pick out the key</text>
<text x="565" y="248" font-size="12" fill="#1a1a1a" text-anchor="middle">among objects under the screen</text>
<line x1="470" y1="228" x2="420" y2="228" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
<text x="360" y="342" font-size="12" fill="#5b6470" text-anchor="middle" font-style="italic">schematic, after Gazzaniga, Ivry, and Mangun (2014), Fig. 4.13</text>
</svg>

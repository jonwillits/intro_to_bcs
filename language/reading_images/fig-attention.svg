<text x="155.5" y="140.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">refused</text>
<text x="197.0" y="140.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">to</text>

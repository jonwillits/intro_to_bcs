<text x="310.5" y="140.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">ham</text>
<text x="359.0" y="140.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">sandwich</text>
<text x="421.5" y="140.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="italic">because</text>
<text x="463.0" y="140.0" font-size="14" fill="#b8460a" text-anchor="middle" font-weight="bold" font-style="italic">it</text>
<text x="478.0" y="140.0" font-size="14" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="italic">only cooks vegetarian food.</text>

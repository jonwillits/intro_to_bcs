<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="360.0" y="22.0" font-size="14" fill="#13294B" text-anchor="middle" font-weight="bold">How often a model’s word ratings came as close to a person’s as another person’s did</text>

<line x1="200.0" y1="44.0" x2="200.0" y2="194.0" stroke="#5b6470" stroke-width="1.2" stroke-linecap="round"/>
<line x1="200.0" y1="194.0" x2="560.0" y2="194.0" stroke="#5b6470" stroke-width="1.2" stroke-linecap="round"/>
<text x="150.0" y="119.0" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 150.0 119.0)">comparisons matched</text>

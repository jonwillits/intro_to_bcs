<text x="265.0" y="211.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">emotional and</text>
<text x="265.0" y="225.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">abstract scales</text>

<text x="380.0" y="157.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4 of 20</text>
<text x="380.0" y="211.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">sensory scales</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="360.0" y="22.0" font-size="14" fill="#13294B" text-anchor="middle" font-weight="bold">Japanese great tits’ responses to recorded calls, in two orders</text>
<text x="400.0" y="52.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">scan</text>
<text x="400.0" y="67.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">the surroundings</text>
<text x="540.0" y="52.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">approach</text>
<text x="540.0" y="67.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">the loudspeaker</text>
<text x="300.0" y="97.0" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="bold">ABC call</text>
<text x="300.0" y="112.0" font-size="12" fill="#5b6470" text-anchor="end" font-weight="normal">alone</text>
<rect x="355.0" y="84.0" width="90.0" height="28.0" fill="#13294B" stroke="#13294B" stroke-width="1.4" rx="3"/>
<text x="400.0" y="103.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">yes</text>
<rect x="495.0" y="84.0" width="90.0" height="28.0" fill="#ffffff" stroke="#5b6470" stroke-width="1.4" rx="3"/>
<text x="540.0" y="103.0" font-size="13" fill="#5b6470" text-anchor="middle" font-weight="normal">no</text>
<text x="300.0" y="137.0" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="bold">D call</text>
<text x="300.0" y="152.0" font-size="12" fill="#5b6470" text-anchor="end" font-weight="normal">alone</text>
<rect x="355.0" y="124.0" width="90.0" height="28.0" fill="#ffffff" stroke="#5b6470" stroke-width="1.4" rx="3"/>
<text x="400.0" y="143.0" font-size="13" fill="#5b6470" text-anchor="middle" font-weight="normal">no</text>
<rect x="495.0" y="124.0" width="90.0" height="28.0" fill="#13294B" stroke="#13294B" stroke-width="1.4" rx="3"/>
<text x="540.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">yes</text>
<text x="300.0" y="177.0" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="bold">ABC then D</text>
<text x="300.0" y="192.0" font-size="12" fill="#5b6470" text-anchor="end" font-weight="normal">the usual order</text>
<rect x="355.0" y="164.0" width="90.0" height="28.0" fill="#13294B" stroke="#13294B" stroke-width="1.4" rx="3"/>
<text x="400.0" y="183.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">yes</text>
<rect x="495.0" y="164.0" width="90.0" height="28.0" fill="#13294B" stroke="#13294B" stroke-width="1.4" rx="3"/>
<text x="540.0" y="183.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">yes</text>
<text x="300.0" y="217.0" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="bold">D then ABC</text>
<text x="300.0" y="232.0" font-size="12" fill="#5b6470" text-anchor="end" font-weight="normal">the order reversed</text>
<rect x="355.0" y="204.0" width="90.0" height="28.0" fill="#c9d6e8" stroke="#13294B" stroke-width="1.4" rx="3" stroke-dasharray="4 3"/>
<text x="400.0" y="223.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal">reduced</text>
<rect x="495.0" y="204.0" width="90.0" height="28.0" fill="#c9d6e8" stroke="#13294B" stroke-width="1.4" rx="3" stroke-dasharray="4 3"/>
<text x="540.0" y="223.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal">reduced</text>
<text x="360.0" y="254.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="italic">after Suzuki, Wheatcroft, and Griesser (2016), Figs. 1, 3, and 4; responses shown as present, absent, or reduced, without numbers</text>
</svg>

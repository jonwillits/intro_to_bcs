<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="380.0" y="22.0" font-size="14" fill="#b8460a" text-anchor="middle" font-weight="bold">The selection task, in two versions</text>
<text x="24.0" y="52.0" font-size="12" fill="#b8460a" text-anchor="start" font-weight="bold">abstract rule</text>
<text x="24.0" y="70.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="italic">If a card has an R on one side, then it has a 2 on the other side.</text>
<rect x="24.0" y="82.0" width="78.0" height="52.0" fill="#ffffff" stroke="#FF5F05" stroke-width="3.0" rx="5"/>
<text x="63.0" y="113.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="bold">R</text>
<rect x="118.0" y="82.0" width="78.0" height="52.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" rx="5"/>
<text x="157.0" y="113.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="bold">J</text>
<rect x="212.0" y="82.0" width="78.0" height="52.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" rx="5"/>
<text x="251.0" y="113.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>
<rect x="306.0" y="82.0" width="78.0" height="52.0" fill="#ffffff" stroke="#FF5F05" stroke-width="3.0" rx="5"/>
<text x="345.0" y="113.0" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="bold">8</text>
<text x="420.0" y="114.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">at most a quarter solve</text>
<text x="24.0" y="170.0" font-size="12" fill="#b8460a" text-anchor="start" font-weight="bold">drinking-age rule</text>
<text x="24.0" y="188.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="italic">If a person is drinking beer, then the person must be over 19 years old.</text>
<rect x="24.0" y="200.0" width="78.0" height="52.0" fill="#ffffff" stroke="#FF5F05" stroke-width="3.0" rx="5"/>
<text x="63.0" y="224.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">drinking</text>
<text x="63.0" y="238.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">beer</text>
<rect x="118.0" y="200.0" width="78.0" height="52.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" rx="5"/>
<text x="157.0" y="224.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">drinking</text>
<text x="157.0" y="238.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">cola</text>
<rect x="212.0" y="200.0" width="78.0" height="52.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" rx="5"/>
<text x="251.0" y="224.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">22 years</text>
<text x="251.0" y="238.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">old</text>
<rect x="306.0" y="200.0" width="78.0" height="52.0" fill="#ffffff" stroke="#FF5F05" stroke-width="3.0" rx="5"/>
<text x="345.0" y="224.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">16 years</text>
<text x="345.0" y="238.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">old</text>
<text x="420.0" y="232.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal">about three quarters solve</text>
<text x="420.0" y="254.0" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="italic">outlined: the two cards that could</text>
<text x="420.0" y="268.0" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="italic">reveal a broken rule</text>
<text x="380.0" y="292.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="italic">after Cosmides (1989) and Buller (2005), Box 1</text>
</svg>

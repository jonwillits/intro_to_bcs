# ======================================================================
# Quarto project config for the BCOG 100 interactive textbook.
#
# TWO BLOCKS IN THIS FILE ARE GENERATED. The module lists under
# `project: render:` and under `website: sidebar: contents:` each sit between a
# pair of marker comments (look for BUILD:render and BUILD:sidebar below), and
# are rewritten every time you run
#
#     python3 ../course_creation/tools/build/build_course.py
#
# Do not hand-edit inside the markers; the next build overwrites it. Everything
# outside them is yours. Note that a marker only counts when it is alone on its
# line, which is why this comment spells the names out rather than quoting them.
#
# TO PUBLISH A MODULE you no longer edit this file at all. A module's reading
# goes live automatically once the reading exists and passes the audit script;
# until then the builder writes a "coming soon" stub at <module>/index.qmd and
# points the sidebar there. Slides and labs appear in a module's page margin
# only when they are listed in course_creation/tools/build/site_manifest.yml —
# that list is the record of what has been reworked to agree with the chapter.
#
# WHY the sidebar lists ONLY readings and stubs: Quarto's Next/Previous buttons
# walk the sidebar in order, so a module's downloads must NOT live in the
# sidebar (landing on a PDF would dead-end the flow). Each module surfaces its
# reading PDF / slides / lab via `other-links` on the page itself — see the
# generated `_metadata.yml` in the module folder — which keeps them out of the
# linear Next/Previous chain. Result: readings form one continuous spine.
#
# `render:` is an allow-list: only files named here become pages, so labs,
# .pptx, and READMEs elsewhere in the repo are never touched.
# ======================================================================

project:
  type: website
  output-dir: _site
  # Copy each module folder's PDFs (the downloadable reading PDF from the build
  # script, plus the lecture-slide PDFs) into the built site so links resolve.
  resources:
    - "*/*.pdf"
  render:
    # <<< BUILD:render >>>
    - index.qmd
    - course_overview/course_overview_reading.md
    - mind_and_brain/mind_and_brain_reading.md
    - comparative_approaches/index.qmd
    - neurons_and_neural_communication/index.qmd
    - neural_circuits_affect_and_valence/index.qmd
    - learning_and_plasticity/index.qmd
    - vertebrate_neural_architecture/index.qmd
    - pattern_recognition/index.qmd
    - perception_and_action/index.qmd
    - spatial_cognition/index.qmd
    - memory_and_generative_models/index.qmd
    - social_cognition/index.qmd
    - planning_and_decisionmaking/index.qmd
    - language/index.qmd
    - symbolic_cognition/index.qmd
    - culture_and_cognition/index.qmd
    # <<< /BUILD:render >>>

website:
  title: "Brain & Cognitive Science I"
  site-url: "https://jonwillits.github.io/intro_to_bcs/"
  repo-url: "https://github.com/jonwillits/intro_to_bcs"
  description: "An interactive textbook for BCOG 100, University of Illinois."
  reader-mode: true
  page-navigation: true
  navbar:
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Interactive Labs"
        href: "https://jonwillits.github.io/bcogapp/"
        target: _blank
    right:
      - icon: github
        href: "https://github.com/jonwillits/intro_to_bcs"
        aria-label: "Source on GitHub"

  # --------------------------------------------------------------------
  # SIDEBAR = the table of contents for the whole book.
  # Generated — the section groupings live in SIDEBAR_SECTIONS in
  # course_creation/tools/build/build_course.py, the titles and the
  # "coming soon" dates in tools/build/site_manifest.yml.
  # --------------------------------------------------------------------
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    contents:
      # <<< BUILD:sidebar >>>
      - text: "Welcome"
        href: index.qmd

      - section: "Foundations"
        contents:
          - text: "0 · Course Overview"
            href: course_overview/course_overview_reading.md
          - text: "1 · Mind & Brain"
            href: mind_and_brain/mind_and_brain_reading.md
          - text: "2 · Comparative Approaches — coming soon"
            href: comparative_approaches/index.qmd

      - section: "The First Nervous Systems"
        contents:
          - text: "3 · Neurons & Neural Communication — coming soon"
            href: neurons_and_neural_communication/index.qmd
          - text: "4 · Neural Circuits, Affect & Valence — coming soon"
            href: neural_circuits_affect_and_valence/index.qmd
          - text: "5 · Learning & Plasticity — coming soon"
            href: learning_and_plasticity/index.qmd
          - text: "6 · Vertebrate Neural Architecture — coming soon"
            href: vertebrate_neural_architecture/index.qmd

      - section: "Perceiving & Modeling the World"
        contents:
          - text: "7 · Pattern Recognition — coming soon"
            href: pattern_recognition/index.qmd
          - text: "8 · Perception & Action — coming soon"
            href: perception_and_action/index.qmd
          - text: "9 · Spatial Cognition — coming soon"
            href: spatial_cognition/index.qmd
          - text: "10 · Memory, Imagination & Generative Models — coming soon"
            href: memory_and_generative_models/index.qmd

      - section: "Social & Symbolic Minds"
        contents:
          - text: "11 · Social Cognition — coming soon"
            href: social_cognition/index.qmd
          - text: "12 · Planning & Decision-Making — coming soon"
            href: planning_and_decisionmaking/index.qmd
          - text: "13 · Language — coming soon"
            href: language/index.qmd
          - text: "14 · Symbolic Cognition — coming soon"
            href: symbolic_cognition/index.qmd
          - text: "15 · Culture & Cognition — coming soon"
            href: culture_and_cognition/index.qmd
      # <<< /BUILD:sidebar >>>

# The site renders each reading to an HTML page only. The downloadable PDF is
# the one produced by build_course.py (it lives in the module folder as
# <name>_reading.pdf and is linked from that module's `_metadata.yml`, in the
# page margin — not the sidebar), so Quarto does NOT generate its own PDF.
# That avoids two PDFs fighting over the same filename. `format-links` is off
# for the same reason.
format:
  html:
    theme: cosmo          # Bootstrap base; overrides live in styles.css
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true

format-links: false

# The reading filters. THIS LIST IS THE SINGLE SOURCE OF TRUTH: the website
# applies it here, and build_reading.py reads this same block and passes each
# entry to pandoc as --lua-filter, so the PDF and the site can never drift.
# build_course.py hashes whatever is listed here for its staleness check.
#
# ORDER MATTERS. figures.lua must run first: it resolves the .if-figure /
# .no-figure conditional blocks, and until it has, a bold glossary term that
# appears in both halves of a conditional pair would be counted twice by
# glossary_links.lua and reported as a stray bold.
filters:
  - figures.lua
  - glossary_links.lua

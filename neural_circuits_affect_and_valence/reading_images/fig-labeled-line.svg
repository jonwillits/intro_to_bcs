<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Cambria, Calibri, Arial, sans-serif">
<text x="350.0" y="26.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">The same cell, wired two ways</text>
<rect x="40.0" y="56.0" width="280.0" height="190.0" fill="none" stroke="#e2e6ec" rx="4"/>
<text x="180.0" y="48.0" font-size="13" fill="#b8460a" text-anchor="middle" font-weight="bold">Wired one way</text>
<circle cx="90.0" cy="150.0" r="15.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="90.0" y="186.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">one sensory cell</text>
<text x="90.0" y="202.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">firing at rate r</text>
<rect x="208.0" y="83.0" width="86" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="4" opacity="1"/>
<text x="251.0" y="104.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">forward muscles</text>
<rect x="208.0" y="183.0" width="86" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="4" opacity="0.3"/>
<text x="251.0" y="204.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">reverse muscles</text>
<line x1="104.3" y1="145.6" x2="228.1" y2="107.1" stroke="#13294B" stroke-width="2.0"/>
<polygon points="236.7,104.4 229.4,111.4 226.7,102.8" fill="#13294B"/>
<text x="180.0" y="272.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">the animal moves toward it</text>
<rect x="380.0" y="56.0" width="280.0" height="190.0" fill="none" stroke="#e2e6ec" rx="4"/>
<text x="520.0" y="48.0" font-size="13" fill="#b8460a" text-anchor="middle" font-weight="bold">Wired the other</text>
<circle cx="430.0" cy="150.0" r="15.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="430.0" y="186.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">one sensory cell</text>
<text x="430.0" y="202.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">firing at rate r</text>
<rect x="548.0" y="83.0" width="86" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="4" opacity="0.3"/>
<text x="591.0" y="104.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">forward muscles</text>
<rect x="548.0" y="183.0" width="86" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="4" opacity="1"/>
<text x="591.0" y="204.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">reverse muscles</text>
<line x1="444.3" y1="154.4" x2="568.1" y2="192.9" stroke="#13294B" stroke-width="2.0"/>
<polygon points="576.7,195.6 566.7,197.2 569.4,188.6" fill="#13294B"/>
<text x="520.0" y="272.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">the animal moves away from it</text>
<text x="350.0" y="308.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">Nothing about the cell or its rate differs. Only what it is wired to.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Cambria, Calibri, Arial, sans-serif">
<text x="350.0" y="26.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">The body wall runs on mutual inhibition</text>
<circle cx="190" cy="160" r="72" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="190.0" y="74.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">back (dorsal)</text>
<text x="190.0" y="258.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">belly (ventral)</text>
<path d="M 118 160 a 72 72 0 0 1 144 0" fill="#13294B" opacity="0.85"/>
<path d="M 118 160 a 72 72 0 0 0 144 0" fill="none" stroke="#D50032" stroke-width="6" stroke-dasharray="7 5"/>
<text x="190.0" y="134.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">contracting</text>
<text x="190.0" y="200.0" font-size="12" fill="#D50032" text-anchor="middle" font-weight="normal">released</text>
<text x="190.0" y="300.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">one cross-section</text>
<circle cx="440.0" cy="110.0" r="15.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="440.0" y="114.0" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal">ACh</text>
<text x="440.0" y="82.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">excitatory motor neuron</text>
<circle cx="440.0" cy="220.0" r="15.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="440.0" y="224.0" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="normal">GABA</text>
<text x="440.0" y="252.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">inhibitory motor neuron</text>
<line x1="455.0" y1="110.0" x2="556.0" y2="110.0" stroke="#13294B" stroke-width="2.0"/>
<polygon points="565.0,110.0 556.0,114.5 556.0,105.5" fill="#13294B"/>
<line x1="455.0" y1="220.0" x2="559.0" y2="220.0" stroke="#D50032" stroke-width="2.0"/>
<line x1="559.0" y1="226.0" x2="559.0" y2="214.0" stroke="#D50032" stroke-width="3"/>
<text x="600.0" y="114.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal">back muscle</text>
<text x="600.0" y="224.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal">belly muscle</text>
<text x="430.0" y="300.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">Then the two swap, and the alternation runs head to tail.</text>
</svg>

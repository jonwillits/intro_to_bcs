<rect x="0" y="0" width="780" height="424" fill="#ffffff"/>
<rect x="110.0" y="52.0" width="590.0" height="248.0" rx="3" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.0"/>
<rect x="110.0" y="244.9" width="590.0" height="55.1" fill="#eef3f9"/>
<line x1="110.0" y1="244.9" x2="700.0" y2="244.9" stroke="#13294B" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="690.0" y="263.9" font-size="12.5" fill="#13294B" text-anchor="end" font-weight="normal" font-style="normal">fast enough to matter to an animal</text>
<line x1="110.0" y1="52.0" x2="110.0" y2="300.0" stroke="#eef1f5" stroke-width="1" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" width="420" height="390" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="210.0" y="22.0" font-size="14" fill="#b8460a" text-anchor="middle" font-weight="bold">A list to try</text>
<text x="210.0" y="54.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">bed</text>
<text x="210.0" y="71.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">rest</text>
<text x="210.0" y="89.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">awake</text>
<text x="210.0" y="106.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">tired</text>
<text x="210.0" y="124.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">dream</text>
<text x="210.0" y="141.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">wake</text>
<text x="210.0" y="159.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">night</text>
<text x="210.0" y="176.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">blanket</text>
<text x="210.0" y="194.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">doze</text>
<text x="210.0" y="211.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">slumber</text>
<text x="210.0" y="229.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">snore</text>
<text x="210.0" y="246.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">pillow</text>
<text x="210.0" y="264.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">peace</text>
<text x="210.0" y="281.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">yawn</text>
<text x="210.0" y="299.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="normal">drowsy</text>
<line x1="70.0" y1="317.0" x2="350.0" y2="317.0" stroke="#FF5F05" stroke-width="1.6" stroke-linecap="round"/>
<text x="210.0" y="339.0" font-size="12" fill="#b8460a" text-anchor="middle" font-weight="bold">Was sleep on the list?</text>
<text x="210.0" y="356.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="normal">No, though every word above is associated with it.</text>
<text x="210.0" y="382.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="italic">list from Roediger and McDermott (1995), p. 807</text>
</svg>

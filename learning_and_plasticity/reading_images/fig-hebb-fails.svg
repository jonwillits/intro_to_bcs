<text x="700.0" y="162.0" font-size="10" fill="#5b6470" text-anchor="end" font-weight="normal">no moment contains both</text>
<line x1="150.0" y1="192.0" x2="640.0" y2="192.0" stroke="#e2e6ec" stroke-width="1.2" stroke-linecap="round"/>
<rect x="214.0" y="178.0" width="56.0" height="28.0" fill="#fdeee2" stroke="#FF5F05" stroke-width="1.6" rx="3"/>

<text x="556.0" y="306.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">food</text>
<text x="370.0" y="358.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">the shaded action is the one that mattered; nothing in the rule marks it</text>

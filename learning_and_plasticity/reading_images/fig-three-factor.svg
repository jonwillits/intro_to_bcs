<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 336" width="740" height="336" font-family="Cambria, Calibri, Arial, DejaVu Sans, sans-serif">
<text x="370.0" y="22.0" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="bold">Two cells make a synapse eligible. A third signal decides what happens.</text>
<circle cx="128.0" cy="178.0" r="25.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="128.0" y="183.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">pre</text>
<circle cx="330.0" cy="178.0" r="25.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="330.0" y="183.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">post</text>
<line x1="155.0" y1="178.0" x2="291.0" y2="178.0" stroke="#6B7280" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="299.0,178.0 291.0,182.5 291.0,173.5" fill="#6B7280"/>
<circle cx="229.0" cy="178.0" r="10.0" fill="#eef0f2" stroke="#6B7280" stroke-width="2.0"/>
<text x="128.0" y="224.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">presynaptic activity</text>
<text x="330.0" y="224.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">postsynaptic activity</text>
<text x="229.0" y="252.0" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="bold">together, these make</text>
<text x="229.0" y="267.0" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="bold">the synapse eligible</text>
<line x1="229.0" y1="92.0" x2="229.0" y2="151.0" stroke="#6B7280" stroke-width="2.0" stroke-linecap="butt" stroke-dasharray="6 4"/>
<polygon points="229.0,160.0 224.0,151.0 234.0,151.0" fill="#6B7280"/>
<text x="229.0" y="68.0" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="bold">a modulatory signal from elsewhere</text>
<text x="229.0" y="52.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">the third factor</text>
<rect x="436.0" y="62.0" width="268.0" height="72.0" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2" rx="5"/>
<text x="516.0" y="90.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">a signal that says</text>
<text x="516.0" y="103.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">better than expected</text>
<circle cx="608.0" cy="96.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="668.0" cy="96.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="617.0" y1="96.0" x2="659.0" y2="96.0" stroke="#6B7280" stroke-width="4.5" stroke-linecap="butt"/>
<line x1="638.0" y1="84.0" x2="638.0" y2="77.0" stroke="#6B7280" stroke-width="1.8" stroke-linecap="butt"/>
<polygon points="638.0,70.0 642.0,77.0 634.0,77.0" fill="#6B7280"/>
<text x="638.0" y="124.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">strengthened</text>
<rect x="436.0" y="150.0" width="268.0" height="72.0" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2" rx="5"/>
<text x="516.0" y="178.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">a different</text>
<text x="516.0" y="191.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">modulatory signal</text>
<circle cx="608.0" cy="184.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="668.0" cy="184.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="617.0" y1="184.0" x2="659.0" y2="184.0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="638.0" y1="158.0" x2="638.0" y2="165.0" stroke="#6B7280" stroke-width="1.8" stroke-linecap="butt"/>
<polygon points="638.0,172.0 634.0,165.0 642.0,165.0" fill="#6B7280"/>
<text x="638.0" y="212.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">weakened</text>
<rect x="436.0" y="238.0" width="268.0" height="72.0" fill="#ffffff" stroke="#e2e6ec" stroke-width="1.2" rx="5"/>
<text x="516.0" y="266.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">no signal arrives</text>
<text x="516.0" y="279.0" font-size="10" fill="#5b6470" text-anchor="middle" font-weight="normal">inside the window</text>
<circle cx="608.0" cy="272.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="668.0" cy="272.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="617.0" y1="272.0" x2="659.0" y2="272.0" stroke="#6B7280" stroke-width="2.4" stroke-linecap="butt"/>
<line x1="628.0" y1="252.0" x2="648.0" y2="252.0" stroke="#5b6470" stroke-width="1.8" stroke-linecap="round"/>
<text x="638.0" y="300.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">unchanged</text>
<text x="370.0" y="320.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">the third factor can reverse the direction of the change, not merely scale its size</text>
</svg>

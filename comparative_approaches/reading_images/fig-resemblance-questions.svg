  <text x="210" y="38" font-size="11.5" fill="#5b6470" letter-spacing="0.4">THE FIRST QUESTION</text>
  <text x="210" y="59" font-size="14" fill="#1a1a1a" font-weight="bold">Where did the similarity come from?</text>
  <text x="210" y="79" font-size="12.5" fill="#5b6470">shared origin  ·  shared problem  ·  coincidence</text>

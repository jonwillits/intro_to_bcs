  <text x="210" y="128" font-size="11.5" fill="#5b6470" letter-spacing="0.4">THE SECOND QUESTION</text>
  <text x="210" y="149" font-size="14" fill="#1a1a1a" font-weight="bold">How deep does the similarity go?</text>
  <text x="210" y="169" font-size="12.5" fill="#5b6470">outward behavior  ·  the procedure  ·  the machinery</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 743" width="820" height="743" font-family="Cambria, Calibri, Arial, sans-serif" role="img">
<line x1="34" y1="61.0" x2="34" y2="205.0" stroke="#c3cddd" stroke-width="4" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="34" y1="205.0" x2="34" y2="708.0" stroke="#c3cddd" stroke-width="4"/>
<text x="23" y="34" font-size="13.5" fill="#5b6470" font-style="italic" letter-spacing="0.3">Framing — the questions, and the tools for asking them</text>
<line x1="23" y1="41" x2="812" y2="41" stroke="#e2e6ec" stroke-width="1"/>
<circle cx="34" cy="61.0" r="11" fill="#ffffff" stroke="#13294B" stroke-width="2"/>
<text x="34" y="65.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#13294B">0</text>
<text x="60" y="66.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Course Overview</text>
<text x="300" y="66.0" font-size="14" fill="#5b6470">what this field is, and why it takes so many disciplines</text>
<circle cx="34" cy="95.0" r="11" fill="#ffffff" stroke="#13294B" stroke-width="2"/>
<text x="34" y="99.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#13294B">1</text>
<text x="60" y="100.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Mind &amp; Brain</text>
<text x="300" y="100.0" font-size="14" fill="#5b6470">how mind relates to matter, and how to study it anyway</text>
<circle cx="34" cy="129.0" r="11" fill="#ffffff" stroke="#13294B" stroke-width="2"/>
<text x="34" y="133.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#13294B">2</text>
<text x="60" y="134.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Comparative Approaches</text>
<text x="300" y="134.0" font-size="14" fill="#5b6470">how to compare minds without fooling yourself</text>
<text x="23" y="178" font-size="13.5" fill="#5b6470" font-style="italic" letter-spacing="0.3">The spine — capacities, roughly in the order they were added</text>
<line x1="23" y1="185" x2="812" y2="185" stroke="#e2e6ec" stroke-width="1"/>
<circle cx="34" cy="205.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="209.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="60" y="200.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Neurons &amp; Neural</text>
<text x="60" y="219.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Communication</text>
<text x="300" y="210.0" font-size="14" fill="#5b6470">a cell that sends a signal the length of a body, fast</text>
<circle cx="34" cy="258.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="262.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
<text x="60" y="253.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Neural Circuits, Affect</text>
<text x="60" y="272.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">&amp; Valence</text>
<text x="300" y="263.0" font-size="14" fill="#5b6470">some things become worth approaching, others worth fleeing</text>
<circle cx="34" cy="311.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="315.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
<text x="60" y="316.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Learning &amp; Plasticity</text>
<text x="300" y="316.0" font-size="14" fill="#5b6470">behavior that changes with experience, within one lifetime</text>
<circle cx="34" cy="345.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="349.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="60" y="340.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Vertebrate Neural</text>
<text x="60" y="359.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Architecture</text>
<text x="300" y="350.0" font-size="14" fill="#5b6470">a brain with a floor plan: parts that specialize and cooperate</text>
<circle cx="34" cy="398.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="402.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<text x="60" y="403.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Pattern Recognition</text>
<text x="300" y="403.0" font-size="14" fill="#5b6470">something stable pulled out of noisy, never-repeating input</text>
<circle cx="34" cy="432.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="436.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text>
<text x="60" y="437.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Perception &amp; Action</text>
<text x="300" y="437.0" font-size="14" fill="#5b6470">perceiving and moving as one loop, not two systems</text>
<circle cx="34" cy="466.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="470.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">9</text>
<text x="60" y="471.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Spatial Cognition</text>
<text x="300" y="471.0" font-size="14" fill="#5b6470">knowing where things are, and finding the way back</text>
<circle cx="34" cy="500.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="504.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">10</text>
<text x="60" y="495.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Memory, Imagination &amp;</text>
<text x="60" y="514.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Generative Models</text>
<text x="300" y="505.0" font-size="14" fill="#5b6470">holding on to the past — and running what has not happened</text>
<circle cx="34" cy="553.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="557.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">11</text>
<text x="60" y="558.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Social Cognition</text>
<text x="300" y="558.0" font-size="14" fill="#5b6470">keeping track of what the others are up to</text>
<circle cx="34" cy="587.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="591.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">12</text>
<text x="60" y="582.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Planning &amp;</text>
<text x="60" y="601.5" font-size="14.5" font-weight="bold" fill="#1a1a1a">Decision-Making</text>
<text x="300" y="592.0" font-size="14" fill="#5b6470">choosing between futures before living any of them</text>
<circle cx="34" cy="640.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="644.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">13</text>
<text x="60" y="645.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Language</text>
<text x="300" y="645.0" font-size="14" fill="#5b6470">an open-ended code: sentences nobody has ever said before</text>
<circle cx="34" cy="674.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="678.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">14</text>
<text x="60" y="679.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Symbolic Cognition</text>
<text x="300" y="679.0" font-size="14" fill="#5b6470">one thing standing for another, purely by agreement</text>
<circle cx="34" cy="708.0" r="11" fill="#13294B" stroke="#13294B" stroke-width="2"/>
<text x="34" y="712.5" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">15</text>
<text x="60" y="713.0" font-size="14.5" font-weight="bold" fill="#1a1a1a">Culture &amp; Cognition</text>
<text x="300" y="713.0" font-size="14" fill="#5b6470">passing what you learned to minds that never met you</text>
</svg>